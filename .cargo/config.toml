# Build local au maximum des capacites du CPU hote (AVX2/FMA/NEON...).
# Si vous distribuez ce projet, retirez ce fichier ou compilez avec
# RUSTFLAGS="-C target-cpu=x86-64-v3" pour un binaire portable.
[build]
rustflags = ["-C", "target-cpu=native"]

[target.'cfg(unix)']
rustflags = ["-C", "target-cpu=native"]
