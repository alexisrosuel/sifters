[package]
name = "minvp-python"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"
description = "Binding Python natif (PyO3) pour minvp : selection E-optimale de variables."
license = "MIT OR Apache-2.0"
publish = false

[lib]
# Le nom du module d'extension : `import minvp._minvp`.
name = "_minvp"
crate-type = ["cdylib"]

[dependencies]
minvp = { path = "../..", version = "0.1.0" }
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.12"

[build-dependencies]
pyo3-build-config = "0.29"
