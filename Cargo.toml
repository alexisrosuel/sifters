[workspace]
members = ["crates/sifters-python"]
# `cargo build --release` at the root only builds the Rust library; the Python
# extension is built with `maturin develop` (or `cargo build -p sifters-python`).
default-members = ["."]

[package]
name = "sifters"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Spectral feature selection in safe Rust: certified selection of the best-conditioned variable subset by maximizing the smallest eigenvalue of the correlation matrix."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["feature-selection", "eigenvalues", "correlation", "statistics", "optimization"]
categories = ["science", "mathematics"]

[dependencies]
rayon = "1.12"

[lib]
name = "sifters"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "unwind"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
