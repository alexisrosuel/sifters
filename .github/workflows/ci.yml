name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      # `--workspace` is required: the root Cargo.toml sets
      # `default-members = ["."]`, so a bare `--all-targets` would never compile
      # the PyO3 binding crate under `crates/sifters-python`.
      - name: Clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Docs (deny rustdoc warnings)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Tests
        run: cargo test --release

  lint:
    name: Python — ruff / mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned to the versions the repo was linted with, so the gate stays
      # reproducible (the rule set is already explicit in `[tool.ruff.lint]`).
      - name: Install lint tooling
        run: pip install "ruff==0.16.9" "mypy==2.3.1" numpy

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy scripts tests

  python:
    name: Python ${{ matrix.python-version }} — wheel + pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The extension is not abi3: each interpreter gets its own wheel, so the
        # matrix proves the declared floor (3.9) and a current release both work.
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build wheel (maturin)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter
          manylinux: auto

      - name: Install wheel + test deps
        run: |
          pip install --force-reinstall --no-deps dist/*.whl
          pip install numpy pytest

      - name: Import smoke test
        run: |
          python -c "import sifters; print('sifters', sifters.__version__)"
          python -c "
          import numpy as np, sifters
          X = np.random.default_rng(0).normal(size=(200, 60))
          r = sifters.select(X, k=10)
          print('select OK:', r.k, r.lambda_min)
          "

      - name: Python API tests
        run: pytest tests -q

  english:
    name: Sources are English
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on French accented characters
        run: |
          # The delivered package must be written in English; emoji and other
          # symbols are fine, accented Latin letters are not.
          if grep -rInP '[\x{00C0}-\x{00FF}\x{0152}\x{0153}\x{0178}]' \
               --include='*.rs' --include='*.py' --include='*.pyi' \
               --include='*.md' --include='*.toml' --include='*.yml' . ; then
            echo "Accented characters found: the package must be in English."
            exit 1
          fi
