[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "minvp"
version = "0.2.0"
description = "Sélection E-optimale de variables : maximise la plus petite valeur propre de la matrice de corrélation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Alexis Rosuel" }]
keywords = ["statistics", "feature-selection", "eigenvalues", "correlation", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# numpy n'est pas requis : il n'est utilisé (s'il est présent) que pour convertir
# listes/DataFrames en un tampon `float64` contigu.
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.22"]
test = ["pytest>=7", "numpy>=1.22"]

[project.urls]
Homepage = "https://github.com/alexisrosuel/min_vp"

[tool.maturin]
# Extension native : `crates/minvp-python` -> module `minvp._minvp`.
manifest-path = "crates/minvp-python/Cargo.toml"
module-name = "minvp._minvp"
python-source = "python"
# les caches locaux ne doivent pas partir dans la roue
exclude = ["**/__pycache__/**", "**/*.pyc"]
# Le crate declare déjà la feature `pyo3/extension-module`.
strip = true

[tool.pytest.ini_options]
testpaths = ["python"]
python_files = ["test_*.py"]
